{% extends "base.html" %}

{% block title %}404 Page Not Found - PromptForge{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 text-center">
  <div class="col-md-6">
    <div class="glass-panel p-5">
      <h1 class="display-1 fw-bold text-primary mb-2">404</h1>
      <h3 class="fw-bold mb-3">Page Not Found</h3>
      <p class="text-secondary mb-4">The prompt or page you were looking for does not exist or has been moved.</p>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="fas fa-home me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
