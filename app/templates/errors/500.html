{% extends "base.html" %}

{% block title %}500 Server Error - PromptForge{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75 text-center">
  <div class="col-md-6">
    <div class="glass-panel p-5">
      <h1 class="display-1 fw-bold text-danger mb-2">500</h1>
      <h3 class="fw-bold mb-3">Internal Server Error</h3>
      <p class="text-secondary mb-4">Something went wrong on our end. Please try again in a few moments.</p>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">
        <i class="fas fa-home me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
